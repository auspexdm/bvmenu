<style>
:root{
  --plum:#4E1E3E;
  --bougain:#C42A55;
  --ember:#E2604B;
  --paper:#FDFAF6;
  --veneer:#F3E6D3;
  --ink:#2A1D25;
  --muted:#8C7B85;
  --rule:#E2D3C4;
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:118px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Cover ---------- */
.cover{
  position:relative;padding:56px 22px 40px;text-align:center;
  background:
    radial-gradient(120% 80% at 50% 0%, #F7EADB 0%, var(--veneer) 62%, #EBDAC4 100%);
  border-bottom:1px solid var(--rule);overflow:hidden;
}
.vine{position:absolute;inset:0;opacity:.4;pointer-events:none}
.petal{width:74px;height:74px;margin:0 auto 14px;display:block}
.cover h1{
  font-family:var(--display);font-weight:600;font-style:italic;
  font-size:clamp(42px,13vw,64px);line-height:.95;margin:0;color:var(--plum);
  letter-spacing:-.01em;
}
.cover .kicker{
  font-family:var(--display);font-style:italic;font-size:22px;color:var(--plum);
  opacity:.85;margin-top:2px;
}
.cover .tag{
  font-family:var(--display);font-style:italic;font-size:17px;color:#6C4A5E;
  margin:18px auto 0;max-width:300px;line-height:1.4;
}
.cover .place{
  margin-top:16px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:#96755F;font-weight:600;
}

/* ---------- Sticky nav ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(253,250,246,.96);border-bottom:1px solid var(--rule)}
.search-wrap{padding:10px 14px 8px;display:flex;gap:8px;align-items:center}
#search{
  flex:1;font-family:var(--body);font-size:15px;padding:11px 14px;border-radius:999px;
  border:1px solid var(--rule);background:#fff;color:var(--ink);min-width:0;
}
#search:focus{outline:2px solid var(--bougain);outline-offset:1px;border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:12.5px;font-weight:600;letter-spacing:.04em;
  padding:7px 13px;border-radius:999px;border:1px solid var(--rule);
  background:#fff;color:#6E5A66;text-decoration:none;white-space:nowrap;
}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}

/* ---------- Sections ---------- */
main{max-width:720px;margin:0 auto;padding:0 20px 40px}
.sec{padding-top:38px}
.sec-head{margin-bottom:20px}
.sec-head h2{
  font-family:var(--display);font-weight:600;font-size:clamp(32px,8.5vw,42px);
  line-height:.95;margin:0;color:var(--plum);
}
.sec-head .sub{
  font-family:var(--display);font-style:italic;font-size:clamp(22px,6vw,28px);
  color:var(--bougain);margin-left:34px;display:block;margin-top:-2px;
}
.grp{margin-top:26px}
.grp-label{
  font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:4px;
}
.item{padding:13px 0;border-bottom:1px solid #F0E7DC}
.line{display:flex;align-items:baseline;gap:6px}
.name{
  font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink);
  line-height:1.2;
}
.dots{flex:1;border-bottom:1.5px dotted #D8C6B4;transform:translateY(-4px);min-width:14px}
.price{
  font-family:var(--display);font-size:19px;font-weight:600;color:var(--plum);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.price.catch{font-style:italic;font-size:16px;color:var(--bougain);font-weight:500}
.desc{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:52ch;line-height:1.45}
.mark{
  display:inline-block;vertical-align:2px;margin-right:5px;font-size:11px;
}
.mark.chef{color:var(--bougain)}
.mark.pre{color:#B08247}
.badge{
  display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--bougain);border:1px solid #EBC8D2;
  border-radius:3px;padding:1px 5px;margin-left:7px;vertical-align:3px;
}
.badge.pre{color:#A97A38;border-color:#EBDCC0}

/* ---------- Footer ---------- */
footer{background:var(--veneer);border-top:1px solid var(--rule);padding:36px 22px 46px;text-align:center}
footer .thanks{font-family:var(--display);font-style:italic;font-size:34px;color:var(--plum);margin:0 0 18px}
.notes{max-width:420px;margin:0 auto 22px;font-size:12.5px;color:#7A6559;line-height:1.7}
.contact a{display:block;color:var(--plum);text-decoration:none;font-weight:600;font-size:15px;margin:5px 0}
.addr{font-size:12.5px;color:#7A6559;margin-top:12px;line-height:1.5}
.no-results{padding:50px 0;text-align:center;color:var(--muted);font-size:15px}

/* ---------- Edit mode ---------- */
body.editing .name,body.editing .price,body.editing .desc{
  outline:1px dashed #C9B7A8;outline-offset:3px;border-radius:2px;
}
body.editing .desc:empty::before{content:"Add a description";color:#C4B2BC}
body.editing{padding-bottom:96px}
#editbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--plum);color:#fff;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;
}
#editbar b{font-weight:700;letter-spacing:.04em}
#editbar .spacer{flex:1}
#editbar button{
  font-family:var(--body);font-size:13px;font-weight:700;padding:9px 14px;border-radius:999px;
  border:0;background:#fff;color:var(--plum);cursor:pointer;
}
#editbar button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
.rowtools{display:flex;gap:8px;margin-top:8px}
.rowtools button{
  font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#fff;border:1px solid var(--rule);color:#8A6478;padding:5px 10px;border-radius:999px;cursor:pointer;
}
.addbtn{
  font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#fff;border:1px dashed var(--rule);color:var(--plum);padding:9px 14px;
  border-radius:8px;cursor:pointer;margin-top:12px;width:100%;
}
</style>
</head>
<body>

<header class="cover">
  <svg class="petal" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 8 C30 18 18 34 24 52 C29 66 40 74 50 92 C60 74 71 66 76 52 C82 34 70 18 50 8 Z" fill="#C42A55"/>
    <path d="M50 8 C30 18 18 34 24 52 C29 62 36 69 43 78 C46 60 46 32 50 8 Z" fill="#4E1E3E" opacity=".9"/>
    <path d="M50 8 C70 18 82 34 76 52 C71 62 64 69 57 78 C54 60 54 32 50 8 Z" fill="#7A2350" opacity=".85"/>
    <circle cx="50" cy="44" r="6" fill="#FDFAF6"/>
    <path d="M50 44 L50 78" stroke="#4E1E3E" stroke-width="2"/>
  </svg>
  <h1 id="rname">Bougainvillea</h1>
  <div class="kicker" id="rkicker">Restaurant</div>
  <p class="tag" id="rtag"></p>
  <div class="place">Nagaon · Alibaug</div>
</header>

<nav class="bar">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search a dish — prawn, thali, naan…" aria-label="Search the menu">
  </div>
  <div class="chips" id="chips"></div>
</nav>

<main id="app"></main>

<footer>
  <p class="thanks">Thank you!</p>
  <div class="notes" id="notes"></div>
  <div class="contact" id="contact"></div>
  <div class="addr" id="addr"></div>
</footer>

<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('menu-data').textContent);
  var EDIT = /[?&]edit=1/.test(location.search) || location.hash === '#edit';
  var app = document.getElementById('app');
  var chips = document.getElementById('chips');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function isCatch(p){ return /catch|market/i.test(p||''); }

  /* ---------- header + footer text ---------- */
  document.getElementById('rname').textContent = DATA.restaurant;
  document.getElementById('rkicker').textContent = DATA.kicker;
  document.getElementById('rtag').textContent = DATA.tagline;
  document.title = DATA.restaurant + ' — Menu | Nagaon, Alibaug';
  document.getElementById('notes').innerHTML = (DATA.notes||[]).map(function(n){
    return '<div>'+esc(n)+'</div>'; }).join('');
  document.getElementById('contact').innerHTML =
    '<a href="tel:'+esc(DATA.phone)+'">'+esc(DATA.phone)+'</a>'+
    '<a href="mailto:'+esc(DATA.email)+'">'+esc(DATA.email)+'</a>'+
    '<a href="https://'+esc(DATA.web)+'" target="_blank" rel="noopener">'+esc(DATA.web)+'</a>';
  document.getElementById('addr').textContent = DATA.address;

  /* ---------- render ---------- */
  function itemHTML(it, si, gi, ii){
    var marks = '';
    if(it.chef) marks += '<span class="mark chef" title="Chef\u2019s recommendation">\u273D</span>';
    if(it.pre)  marks += '<span class="mark pre" title="Pre-order before 3pm">\u25F4</span>';
    var badge = it.pre ? '<span class="badge pre">Pre-order</span>' : (it.chef ? '<span class="badge">Chef\u2019s pick</span>' : '');
    var ce = EDIT ? ' contenteditable="true" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'"' : '';
    var tools = EDIT ? '<div class="rowtools"><button data-act="chef" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'">Chef mark</button>'+
      '<button data-act="pre" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'">Pre-order</button>'+
      '<button data-act="del" data-s="'+si+'" data-g="'+gi+'" data-i="'+ii+'">Remove</button></div>' : '';
    return '<div class="item" data-name="'+esc((it.n+' '+(it.d||'')).toLowerCase())+'">'+
      '<div class="line">'+
        '<span class="name"'+ce.replace('data-s','data-f="n" data-s')+'>'+marks+esc(it.n)+'</span>'+
        badge+
        '<span class="dots"></span>'+
        '<span class="price'+(isCatch(it.p)?' catch':'')+'"'+ce.replace('data-s','data-f="p" data-s')+'>'+
          (isCatch(it.p)?esc(it.p):'\u20B9 '+esc(it.p))+'</span>'+
      '</div>'+
      ((it.d||EDIT)?'<div class="desc"'+ce.replace('data-s','data-f="d" data-s')+'>'+esc(it.d||'')+'</div>':'')+
      tools+'</div>';
  }

  function render(){
    var html = '', nav = '';
    DATA.sections.forEach(function(sec, si){
      nav += '<a class="chip" href="#'+esc(sec.id)+'" data-id="'+esc(sec.id)+'">'+esc(sec.t.replace(/[&']s?$/,'').trim()+(sec.s?' '+sec.s:''))+'</a>';
      html += '<section class="sec" id="'+esc(sec.id)+'" data-sec>'+
        '<div class="sec-head"><h2>'+esc(sec.t)+(sec.s?'<span class="sub">'+esc(sec.s)+'</span>':'')+'</h2></div>';
      sec.groups.forEach(function(g, gi){
        html += '<div class="grp" data-grp>'+(g.g?'<div class="grp-label">'+esc(g.g)+'</div>':'');
        g.items.forEach(function(it, ii){ html += itemHTML(it, si, gi, ii); });
        if(EDIT) html += '<button class="addbtn" data-act="add" data-s="'+si+'" data-g="'+gi+'">+ Add a dish here</button>';
        html += '</div>';
      });
      html += '</section>';
    });
    app.innerHTML = html;
    chips.innerHTML = nav;
    observe();
  }

  /* ---------- search ---------- */
  document.getElementById('search').addEventListener('input', function(e){
    var q = e.target.value.trim().toLowerCase();
    var any = false;
    app.querySelectorAll('.item').forEach(function(el){
      var hit = !q || el.dataset.name.indexOf(q) > -1;
      el.style.display = hit ? '' : 'none';
      if(hit) any = true;
    });
    app.querySelectorAll('[data-grp]').forEach(function(g){
      var vis = [].some.call(g.querySelectorAll('.item'), function(i){ return i.style.display !== 'none'; });
      g.style.display = vis ? '' : 'none';
    });
    app.querySelectorAll('[data-sec]').forEach(function(s){
      var vis = [].some.call(s.querySelectorAll('[data-grp]'), function(g){ return g.style.display !== 'none'; });
      s.style.display = vis ? '' : 'none';
    });
    var old = document.querySelector('.no-results'); if(old) old.remove();
    if(!any){
      var d = document.createElement('div');
      d.className = 'no-results';
      d.textContent = 'Nothing on the menu matches that. Try a shorter word.';
      app.appendChild(d);
    }
  });

  /* ---------- active chip on scroll ---------- */
  var ticking = false;
  function updateActive(){
    ticking = false;
    var bar = document.querySelector('.bar');
    var offset = bar ? bar.offsetHeight : 110;
    document.documentElement.style.scrollPaddingTop = (offset + 4) + 'px';
    var secs = app.querySelectorAll('[data-sec]');
    var active = null;
    for(var i = 0; i < secs.length; i++){
      if(secs[i].style.display === 'none') continue;
      if(secs[i].getBoundingClientRect().top - offset - 8 <= 0) active = secs[i];
    }
    if(!active && secs.length) active = secs[0];
    if(!active) return;
    var changed = false;
    chips.querySelectorAll('.chip').forEach(function(c){
      var on = c.dataset.id === active.id;
      if(on && !c.classList.contains('on')) changed = true;
      c.classList.toggle('on', on);
    });
    if(changed){
      var el = chips.querySelector('.chip.on');
      if(el) chips.scrollLeft = el.offsetLeft - (chips.clientWidth - el.offsetWidth) / 2;
    }
  }
  function queueUpdate(){
    if(!ticking){ ticking = true; requestAnimationFrame(updateActive); }
  }
  window.addEventListener('scroll', queueUpdate, {passive:true});
  window.addEventListener('resize', queueUpdate);
  function observe(){ updateActive(); }

  /* ---------- edit mode ---------- */
  if(EDIT){
    document.body.classList.add('editing');
    var bar = document.createElement('div');
    bar.id = 'editbar';
    bar.innerHTML = '<b>Editing</b><span>Tap any name, price or note to change it.</span><span class="spacer"></span>'+
      '<button id="dl">Download updated menu</button>'+
      '<button class="ghost" id="exit">View as guest</button>';
    document.body.appendChild(bar);

    app.addEventListener('input', function(e){
      var t = e.target;
      if(!t.dataset || !t.dataset.f) return;
      var it = DATA.sections[t.dataset.s].groups[t.dataset.g].items[t.dataset.i];
      var v = t.textContent.trim();
      if(t.dataset.f === 'p') v = v.replace(/^\u20B9\s*/,'');
      if(t.dataset.f === 'n') v = v.replace(/^[\u273D\u25F4\s]+/,'');
      it[t.dataset.f] = v;
    });

    app.addEventListener('click', function(e){
      var b = e.target.closest('button[data-act]');
      if(!b) return;
      var s = b.dataset.s, g = b.dataset.g, i = b.dataset.i;
      var grp = DATA.sections[s].groups[g];
      if(b.dataset.act === 'add') grp.items.push({n:'New dish', d:'', p:'0'});
      if(b.dataset.act === 'del' && confirm('Remove "'+grp.items[i].n+'" from the menu?')) grp.items.splice(i,1);
      if(b.dataset.act === 'chef') grp.items[i].chef = !grp.items[i].chef;
      if(b.dataset.act === 'pre')  grp.items[i].pre  = !grp.items[i].pre;
      render();
    });

    document.getElementById('exit').addEventListener('click', function(){
      location.href = location.pathname;
    });

    document.getElementById('dl').addEventListener('click', function(){
      var clone = document.documentElement.cloneNode(true);
      clone.querySelector('#app').innerHTML = '';
      clone.querySelector('#chips').innerHTML = '';
      var eb = clone.querySelector('#editbar'); if(eb) eb.remove();
      clone.querySelector('body').classList.remove('editing');
      clone.querySelector('#menu-data').textContent = '\n' + JSON.stringify(DATA, null, 2) + '\n';
      var out = '<!DOCTYPE html>\n' + clone.outerHTML;
      var url = URL.createObjectURL(new Blob([out], {type:'text/html'}));
      var a = document.createElement('a');
      a.href = url; a.download = 'menu.html'; document.body.appendChild(a); a.click();
      a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    });
  }

  render();
})();
</script>
</body>
</html>
